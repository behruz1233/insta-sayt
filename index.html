
<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Behruz | Shaxsiy sahifa</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px;
      font-family: Arial, sans-serif;
      color: white;
      background: linear-gradient(135deg, #101827, #49236d, #a43b73);
    }

    .profile {
      width: 100%;
      max-width: 390px;
      padding: 32px 24px;
      text-align: center;
      background: rgba(255, 255, 255, 0.10);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 25px;
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.25);
    }

    .avatar {
      width: 105px;
      height: 105px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 auto 18px;
      border: 3px solid white;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff9a44, #ee2a7b, #6228d7);
      font-size: 42px;
      font-weight: bold;
    }

    h1 {
      margin: 10px 0;
      font-size: 29px;
    }

    .bio {
      margin-bottom: 25px;
      color: #e5e7eb;
      line-height: 1.6;
    }

    .link {
      display: block;
      margin-top: 13px;
      padding: 16px;
      border-radius: 13px;
      background: white;
      color: #202033;
      text-decoration: none;
      font-weight: bold;
      transition: transform 0.2s, opacity 0.2s;
    }

    .link:hover {
      transform: translateY(-3px);
      opacity: 0.9;
    }

    .instagram {
      background: linear-gradient(90deg, #f9ce34, #ee2a7b, #6228d7);
      color: white;
    }

    .telegram {
      background: #229ed9;
      color: white;
    }

    .phone {
      background: #16a34a;
      color: white;
    }

    footer {
      margin-top: 25px;
      color: #ddd6fe;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <main class="profile">
    <div class="avatar">B</div>

    <h1>Behruz</h1>
    <p class="bio">
      Shaxsiy sahifamga xush kelibsiz! 👋<br>
      Men bilan quyidagi havolalar orqali bog‘laning.
    </p>

    <!-- Instagram havolangizni kiriting -->
    <a class="link instagram"
       href="https://www.instagram.com/INSTAGRAM_USERNAME/"
       target="_blank" rel="noopener noreferrer">
      📸 Instagram profilim
    </a>

    <!-- Telegram username'ni kiriting -->
    <a class="link telegram"
       href="https://t.me/axrorivic_1"
       target="_blank" rel="noopener noreferrer">
      ✈️ Telegram profilim
    </a>

    <!-- Telefon raqamingizni xalqaro formatda kiriting -->
    <a class="link phone" href="tel:+998901234567">
      ☎️ Telefon qilish
    </a>

    <footer>© 2026 Behruz | Shaxsiy sahifa</footer>
  </main>
</body>
</html>
